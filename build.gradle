plugins {
    id 'java'
    id 'application'
}

group = 'com.codealpha'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
            project.findProperty('javaVersion') ? Integer.parseInt(project.property('javaVersion').toString()) : 21
        )
    }
}

application {
    mainClass = 'com.codealpha.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

run {
    standardInput = System.in
}
